name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to assemble without publishing'
        required: false
        default: main

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  assemble:
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          registry-url: https://registry.npmjs.org/
          scope: '@mrketa'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - run: npm test
      - name: Validate tag and reserve the npm version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          node tools/release.mjs validate
          node tools/release.mjs unique-version
      - name: Stage the embedded Node runtime and exact npm artifact
        shell: pwsh
        run: node tools/release.mjs runtime
      - name: Build self-contained Setup.exe
        shell: pwsh
        run: >-
          dotnet publish app/PotassiumMcp.Setup/PotassiumMcp.Setup.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:Version=$(node -p "require('./package.json').version")
      - name: Assemble deterministic release artifacts
        shell: pwsh
        env:
          SETUP_EXE: app/PotassiumMcp.Setup/bin/Release/net8.0-windows/win-x64/publish/PotassiumMcp.Setup.exe
        run: node tools/release.mjs assemble
      - uses: actions/upload-artifact@v4
        with:
          name: potassium-mcp-${{ github.ref_name || 'manual' }}
          path: release-out/
          if-no-files-found: error
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-out/*
      - name: Publish npm package with token and provenance
        if: github.event_name == 'push' && vars.NPM_PUBLISH_ENABLED == 'true'
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_ACCESS: public
        run: |
          $packages = @(Get-ChildItem -LiteralPath release-out -Filter '*.tgz' -File)
          if ($packages.Count -ne 1) { throw "Expected exactly one npm tarball, found $($packages.Count)." }
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $distTag = if ($version.Contains('-')) { 'next' } else { 'latest' }
          npm publish $packages[0].FullName --provenance --access public --tag $distTag
          $publishedTag = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $tags = npm view @mrketa/potassium-mcp dist-tags --json | ConvertFrom-Json
            $publishedTag = $tags.($distTag)
            if ($publishedTag -eq $version) { break }
            Start-Sleep -Seconds 5
          }
          if ($publishedTag -ne $version) {
            throw "npm $distTag dist-tag points to $publishedTag, expected $version"
          }
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} release-out/* --verify-tag --title ${{ github.ref_name }} --generate-notes ${{ contains(github.ref_name, '-') && '--prerelease' || '' }}
