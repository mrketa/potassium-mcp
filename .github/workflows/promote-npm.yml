name: Promote npm latest

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing published package version to promote'
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          registry-url: https://registry.npmjs.org/
          scope: '@mrketa'
      - name: Promote the existing package version
        shell: pwsh
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:PACKAGE_VERSION -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid package version: $env:PACKAGE_VERSION"
          }
          if ($env:PACKAGE_VERSION.Contains('-')) {
            throw "Prerelease versions are published directly to npm's next dist-tag and must not be promoted to latest."
          }
          $package = "@mrketa/potassium-mcp@$env:PACKAGE_VERSION"
          $published = npm view $package version --json | ConvertFrom-Json
          if ($published -ne $env:PACKAGE_VERSION) {
            throw "npm returned version $published for $package"
          }
          npm dist-tag add $package latest
          $actual = $null
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $tags = npm view @mrketa/potassium-mcp dist-tags --json | ConvertFrom-Json
            $actual = $tags.latest
            if ($actual -eq $env:PACKAGE_VERSION) { break }
            Start-Sleep -Seconds 5
          }
          if ($actual -ne $env:PACKAGE_VERSION) {
            throw "latest points to $actual, expected $env:PACKAGE_VERSION"
          }
